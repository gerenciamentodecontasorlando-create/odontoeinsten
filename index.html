te-columns:repeat(3,1fr);gap:12px}.module{background:var(--panel);border:1px solid var(--line);padding:19px;border-radius:9px;color:white;text-align:left}.module small{color:var(--mint);display:block;margin-bottom:10px}.module span{display:block;color:var(--muted);font-size:12px;margin-top:10px}.back{background:transparent;color:var(--mint);padding:0 0 20px}.profile{padding:35px;border:1px solid var(--line);background:var(--panel);border-radius:14px;max-width:850px}.profile h2{font-size:30px}.profile li{padding:10px;color:#b9c8d8}.empty{padding:50px;border:1px dashed var(--line);border-radius:12px;text-align:center}.tabs{display:flex;gap:10px;margin:25px 0}.tabs button{padding:12px;border-radius:6px;background:#172431;color:white}.tabs button.active{color:var(--mint);border-bottom:2px solid var(--mint)}.player{background:#050910;aspect-ratio:16/7;border:1px solid var(--line);border-radius:12px;display:grid;place-items:center;text-align:center;padding:30px}.form{max-width:650px}.form label{display:block;color:#b7c6d6;margin:18px 0 8px}.form input,.form textarea,.form select{width:100%;background:#111b28;border:1px solid var(--line);color:white;border-radius:7px;padding:12px}.form textarea{min-height:100px}.progress{height:4px;background:#243442;border-radius:4px;margin-top:16px}.progress i{height:100%;display:block;background:var(--mint)}footer{color:#6d7c91;font-size:11px;margin-top:40px;padding-top:20px;border-top:1px solid var(--line)}@media(min-width:1450px){.hero{padding:50px}}@media(max-width:1050px){.sidebar{width:195px;padding:30px 16px}main{margin-left:195px}.content{padding:30px 25px}.grid{grid-template-columns:repeat(2,1fr)}.modules{grid-template-columns:repeat(2,1fr)}.hero h2{font-size:30px}.top{padding:0 25px}}@media(max-width:700px){.sidebar{position:static;width:100%;height:auto;padding:20px;border-bottom:1px solid var(--line)}.sidebar .label,.sidefoot{display:none}nav{display:flex;overflow:auto;margin-top:18px}nav button{white-space:nowrap;width:auto; <script type="module">
// ====== CONFIGURE SOMENTE ESTES DOIS CAMPOS ======
const SUPABASE_URL = 'COLE_A_URL_DO_SUPABASE';
const SUPABASE_PUBLIC_KEY = 'COLE_A_CHAVE_PUBLICA_PUBLISHABLE_OU_ANON';
// Nunca coloque secret key, service_role ou senha neste arquivo.
const SDK_URL = 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.1/+esm';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>crypto.randomUUID();
const state={user:null,admin:false,courses:[],enrolled:[],progress:[],route:'home',course:null,module:null,lesson:null,modules:[],lessons:[],questions:[],quiz:[],editing:null,section:'courses',recovery:false,authMode:'login'};
let db,toastTimer,renderVersion=0,authVersion=0;
function notify(message,error=false){clearTimeout(toastTimer);$('#toast').textContent=message;$('#toast').classList.toggle('error',error);$('#toast').hidden=false;toastTimer=setTimeout(()=>$('#toast').hidden=true,8500)}
function explain(err){console.error(err);const m=err?.message||String(err);if(/Invalid login credentials/i.test(m))return 'E-mail ou senha incorretos.';if(/Email not confirmed/i.test(m))return 'Confirme seu e-mail antes de entrar.';if(/rate limit/i.test(m))return 'Muitas tentativas. Aguarde um pouco e tente novamente.';if(/row-level security|permission denied/i.test(m))return 'Operação sem permissão. Confira seu acesso e as políticas no Supabase.';if(/duplicate key|unique constraint/i.test(m))return 'Essa posição já está em uso. Escolha outro número.';if(/fetch|network/i.test(m))return 'Falha de conexão. Confira sua internet e a configuração do Supabase.';return m}
async function query(p){const r=await p;if(r.error)throw r.error;return r.data}
function head(tag,title,desc=''){return `<span class="eyebrow">${esc(tag)}</span><h1>${esc(title)}</h1>${desc?`<p>${esc(desc)}</p>`:''}`}
function empty(t,p){return `<div class="empty"><h2>${esc(t)}</h2><p>${esc(p)}</p></div>`}
function button(label,action,id='',cls='secondary'){return `<button type="button" class="btn ${cls}" data-action="${action}" data-id="${esc(id)}">${esc(label)}</button>`}
function footer(){return '<footer>Odonto Einstein · Orlando Abreu Gomes da Silva<br><br>Cirurgião-dentista · Educação continuada</footer>'}
function isEnrolled(id){return state.admin||state.enrolled.some(e=>e.course_id===id)}
function courseCard(c){return `<article class="card"><div class="cover"><span>${esc(c.category)} · ${c.published?'DISPONÍVEL':'RASCUNHO'}</span><h3>${esc(c.title)}</h3><b class="symbol" aria-hidden="true">✚</b></div><div class="cardbody"><h3>${esc(c.title)}</h3><p>${esc(c.description.slice(0,180))}</p>${button(isEnrolled(c.id)?'Acessar curso →':'Conhecer curso →','course',c.id)}</div></article>`}
function back(){return button('← Catálogo','catalog')}
function youtubeId(value){if(!value.trim())return null;const u=new URL(value);if(!['https:','http:'].includes(u.protocol))throw Error('Link de vídeo inválido.');const host=u.hostname.toLowerCase().replace(/^www\./,'');let id;if(host==='youtu.be')id=u.pathname.split('/')[1];else if(['youtube.com','m.youtube.com','youtube-nocookie.com'].includes(host))id=u.pathname==='/watch'?u.searchParams.get('v'):['embed','shorts','live'].includes(u.pathname.split('/')[1])?u.pathname.split('/')[2]:null;if(!/^[A-Za-z0-9_-]{11}$/.test(id||''))throw Error('Informe um link válido de vídeo do YouTube.');return id}
function go(route,id){state.route=route;if(route==='course')state.course=id;if(route==='lesson')state.lesson=id;state.editing=null;render().catch(e=>notify(explain(e),true));window.scrollTo(0,0)}
async function refreshSession(){const version=++authVersion;const {data,error}=await db.auth.getSession();if(error)throw error;const user=data.session?.user||null;const admin=user?await query(db.rpc('is_admin')):false;const enrolled=user?await query(db.from('enrollments').select('course_id').eq('user_id',user.id)):[];const progress=user?await query(db.from('progress').select('lesson_id').eq('user_id',user.id)):[];const courses=await query(db.from('courses').select('*').order('created_at',{ascending:false}));if(version!==authVersion)return;Object.assign(state,{user,admin,enrolled,progress,courses});$('#identity').textContent=user?.email||'Visitante';$('#account').textContent=user?'Sair':'Entrar';$('#adminNav').hidden=!admin;if(state.recovery)state.route='password';else if(!user&&['admin','library','results','lesson'].includes(state.route))state.route='auth';await render()}
async function loadCourse(){state.modules=await query(db.from('modules').select('*').eq('course_id',state.course).order('position'));const ids=state.modules.map(m=>m.id);state.lessons=ids.length?await query(db.from('lessons').select('*').in('module_id',ids).order('position')):[]}
async function render(){const version=++renderVersion;$('#nav').querySelectorAll('button').forEach(b=>b.classList.toggle('active',b.dataset.route===state.route));$('#crumb').textContent=({home:'Visão geral',catalog:'Catálogo de cursos',course:'Área do curso',lesson:'Área de estudos',admin:'Estúdio do professor',about:'Sobre o professor',library:'Biblioteca',results:'Meus resultados',auth:'Acesso à plataforma',password:'Redefinir senha'})[state.route]||'Odonto Einstein';let html='';if(state.route==='home'){const c=state.courses.find(c=>c.published)||state.courses[0];html=head('Seu próximo passo começa aqui','Conhecimento que transforma a prática.','Um ambiente para aprender, aprofundar e evoluir.')+`<section class="hero"><div><span class="pill">ODONTO EINSTEIN</span><h2>Mais conhecimento.<br>Mais confiança para agir.</h2><p>Videoaulas, materiais de apoio e avaliações organizados em percursos de aprendizagem.</p><div class="stats"><span>▷ Videoaulas</span><span>▤ Apostilas</span><span>✓ Avaliações</span></div>${button('Explorar os cursos ↗','catalog','','')}</div><div class="art"><div class="ring"></div><div class="cross">✚</div><div class="float">✦ CONHECIMENTO APLICADO<br><br>Da teoria à prática clínica.</div></div></section><div class="sectionhead"><h2>Seu próximo aprendizado</h2></div>${c?`<div class="grid">${courseCard(c)}<div class="card" style="padding:30px"><span class="eyebrow">CONHEÇA O PROFESSOR</span><h2>Orlando Abreu Gomes da Silva</h2><p>Odontologia, medicina e tecnologia conectadas à aprendizagem.</p>${button('Ver apresentação','about')}</div></div>`:empty('Novos cursos em preparação','O catálogo será atualizado pelo professor.')}`}
else if(state.route==='catalog'){html=head('Catálogo','Explore os cursos','Cursos publicados têm inscrição gratuita nesta versão.')+`<div class="sectionhead"><input class="search" id="search" placeholder="Buscar por título ou área" aria-label="Buscar curso"></div><div class="grid" id="catalog">${state.courses.map(courseCard).join('')||'<p>Nenhum curso publicado ainda.</p>'}</div>`}
else if(state.route==='about'){html=head('Sobre o professor','Ensino com experiência e visão de futuro.')+`<div class="profile"><span class="avatar" style="width:65px;height:65px;font-size:22px">OA</span><h2>Orlando Abreu Gomes da Silva</h2><span class="eyebrow">Cirurgião-dentista · Fundador da Odonto Einstein</span><p>Uma plataforma para compartilhar conhecimento e aproximar a formação profissional dos recursos da tecnologia.</p><h3>Formação e especialidades</h3><ul><li>Cirurgião-dentista.</li><li>Especialista em Cirurgia e Traumatologia Bucomaxilofacial, Saúde Coletiva e Patologia.</li><li>Graduando em Tecnologia da Informação e Medicina.</li></ul></div>`}
else if(state.route==='auth'||state.route==='password'){html=authHtml()}
else if(state.route==='course'){const c=state.courses.find(c=>c.id===state.course);if(!c)throw Error('Curso indisponível. Volte ao catálogo.');html=back()+head(c.category,c.title,c.description);if(!state.user){html+=empty('Entre para começar','Crie sua conta ou entre para se inscrever e acompanhar seu progresso.')+button('Entrar ou cadastrar','auth','','')}
else if(!isEnrolled(c.id)){html+=`<div class="notice">Inscrição gratuita. Ao se inscrever, você terá acesso às aulas e aos materiais deste curso.</div><div class="actions">${button('Inscrever-me no curso','enroll',c.id,'')}</div>`}
else{await loadCourse();const completed=state.lessons.filter(l=>state.progress.some(p=>p.lesson_id===l.id)).length;html+=`<p>${completed} de ${state.lessons.length} aulas concluídas</p><div class="bar"><i style="width:${state.lessons.length?completed/state.lessons.length*100:0}%"></i></div>`+state.modules.map(m=>{const lessons=state.lessons.filter(l=>l.module_id===m.id);return `<section class="item"><span class="eyebrow">Módulo ${m.position}</span><h2>${esc(m.title)}</h2>${lessons.map(l=>`<div class="itemhead item"><span>${state.progress.some(p=>p.lesson_id===l.id)?'✓':'▷'} ${l.position}. ${esc(l.title)}</span>${button('Estudar','lesson',l.id)}</div>`).join('')||'<p>As aulas deste módulo estão em preparação.</p>'}<div class="actions">${button('Avaliação do módulo','quiz',m.id)}</div><div id="quiz-${m.id}"></div></section>`}).join('');if(!state.modules.length)html+=empty('Módulos em preparação','O professor ainda está organizando este curso.')}}
else if(state.route==='lesson'){if(!state.user)return go('auth');const l=await query(db.from('lessons').select('*').eq('id',state.lesson).single());const m=await query(db.from('modules').select('*').eq('id',l.module_id).single());state.course=m.course_id;state.module=m.id;const done=state.progress.some(p=>p.lesson_id===l.id);html=button('← Voltar ao curso','course',m.course_id)+head('Módulo '+m.position,l.title)+`<div class="tabs"><span class="pill">VIDEOAULA</span></div>${l.youtube_id?`<iframe class="lessonvideo" title="${esc(l.title)}" src="https://www.youtube-nocookie.com/embed/${esc(l.youtube_id)}?rel=0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe>`:empty('Vídeo em preparação','O professor ainda não cadastrou o vídeo desta aula.')}<p class="pre">${esc(l.description)}</p><div class="actions">${l.pdf_path?button('Abrir apostila PDF ↗','pdf',l.id):''}${button(done?'✓ Concluída · desfazer':'Marcar aula como concluída','complete',l.id,done?'secondary':'')}${button('Avaliação do módulo','quiz',m.id)}</div><div id="quiz-${m.id}"></div>`}
else if(state.route==='library'){if(!state.user)return go('auth');const ls=await query(db.from('lessons').select('id,title,module_id,modules(title,course_id)').not('pdf_path','is',null).order('title'));html=head('Biblioteca','Seus materiais, em um só lugar.','PDFs dos cursos em que você está inscrito.')+(ls.length?ls.map(l=>`<div class="item itemhead"><div><h3>${esc(l.title)}</h3><p>${esc(l.modules?.title)}</p></div>${button('Abrir PDF ↗','pdf',l.id)}</div>`).join(''):empty('Nenhuma apostila disponível','Os materiais aparecerão aqui quando forem publicados.'))}
else if(state.route==='results'){if(!state.user)return go('auth');const rows=await query(db.from('attempts').select('*,modules(title)').eq('user_id',state.user.id).order('created_at',{ascending:false}).limit(100));html=head('Seu desempenho','Meus resultados','Últimas 100 tentativas. Cada envio gera um novo resultado.')+(rows.length?rows.map(r=>`<div class="item itemhead"><div><h3>${esc(r.modules?.title||'Módulo indisponível')}</h3><p>${new Date(r.created_at).toLocaleString('pt-BR')}</p></div><span class="pill">${r.score}/${r.total} · ${Math.round(r.score/r.total*100)}%</span></div>`).join(''):empty('Seu histórico começa aqui','Conclua uma avaliação para registrar seu primeiro resultado.'))}
else if(state.route==='admin'){if(!state.admin)throw Error('Área exclusiva do administrador.');html=await adminHtml()}
if(version!==renderVersion)return;$('#app').innerHTML=html+footer();if(state.route==='catalog')$('#search').oninput=e=>{$('#catalog').innerHTML=state.courses.filter(c=>(c.title+' '+c.category).toLocaleLowerCase('pt-BR').includes(e.target.value.toLocaleLowerCase('pt-BR'))).map(courseCard).join('')||'<p>Nenhum curso encontrado.</p>'}}
function authHtml(){if(state.route==='password')return head('Sua conta','Defina uma nova senha')+`<form class="form authbox" id="passwordForm"><label for="newPassword">Nova senha</label><input id="newPassword" name="password" type="password" autocomplete="new-password" minlength="8" required><p><button class="btn">Salvar nova senha</button></p></form>`;const mode=state.authMode;return head('Sua conta',mode==='signup'?'Comece sua jornada':mode==='reset'?'Recupere seu acesso':'Bem-vindo à Odonto Einstein','Use seu e-mail para acessar seus cursos.')+`<form class="form authbox" id="authForm"><label for="email">E-mail</label><input id="email" name="email" type="email" autocomplete="email" required>${mode!=='reset'?'<label for="password">Senha</label><input id="password" name="password" type="password" autocomplete="'+(mode==='signup'?'new-password':'current-password')+'" minlength="8" required>':''}<p><button class="btn">${mode==='signup'?'Criar conta':mode==='reset'?'Enviar link de recuperação':'Entrar'}</button></p><div id="authMessage" role="status"></div></form><div class="actions">${button('Já tenho conta','authMode','login')}${button('Criar conta','authMode','signup')}${button('Esqueci minha senha','authMode','reset')}</div>`}
function field(label,name,value='',type='text',extra=''){return `<label for="f-${name}">${label}</label><input id="f-${name}" name="${name}" type="${type}" value="${esc(value)}" ${extra}>`}
function area(label,name,value='',extra=''){return `<label for="f-${name}">${label}</label><textarea id="f-${name}" name="${name}" ${extra}>${esc(value)}</textarea>`}
function selectModule(selected){return `<label for="f-module_id">Módulo</label><select id="f-module_id" name="module_id" required>${state.modules.map(m=>`<option value="${m.id}" ${m.id===selected?'selected':''}>${m.position}. ${esc(m.title)}</option>`).join('')}</select>`}
async function adminHtml(){if(!state.course||!state.courses.some(c=>c.id===state.course))state.course=state.courses[0]?.id||null;if(state.course)await loadCourse();else{state.modules=[];state.lessons=[]}state.questions=state.modules.length?await query(db.from('questions').select('*').in('module_id',state.modules.map(m=>m.id)).order('position')):[];const section=state.section;let html=head('Estúdio do professor','Gerencie sua plataforma.','Cadastre cursos, organize aulas e publique quando o conteúdo estiver pronto.')+`<div class="notice small">Cursos publicados aceitam inscrição gratuita de qualquer usuário cadastrado. Despublique um curso para suspender o acesso dos alunos. Vídeos não listados no YouTube podem ser compartilhados por quem tem o link.</div><label style="display:block;margin-top:20px" for="adminCourse">Curso selecionado</label><select class="search" id="adminCourse" style="max-width:100%;margin-top:10px">${state.courses.map(c=>`<option value="${c.id}" ${c.id===state.course?'selected':''}>${esc(c.title)} ${c.published?'· publicado':'· rascunho'}</option>`).join('')}</select><div class="tabs">${[['courses','Cursos'],['modules','Módulos'],['lessons','Aulas e PDFs'],['questions','Questões']].map(([id,label])=>`<button class="${section===id?'active':''}" data-action="section" data-id="${id}">${label}</button>`).join('')}</div>`;const e=state.editing;
if(section==='courses'){const c=e?state.courses.find(c=>c.id===e):null;html+=`<form id="courseForm" class="form"><h2>${c?'Editar curso':'Criar um curso'}</h2>${field('Título','title',c?.title||'','text','required maxlength="160"')}${field('Área / categoria','category',c?.category||'Odontologia','text','required')}${area('Descrição','description',c?.description||'')}<label class="checklabel"><input name="published" type="checkbox" ${c?.published?'checked':''}> Publicar e abrir inscrições gratuitas</label><div class="actions"><button class="btn">Salvar curso</button>${c?button('Cancelar edição','cancel'):''}</div></form><h2>Cursos cadastrados</h2>`+state.courses.map(c=>`<div class="item itemhead"><div><b>${esc(c.title)}</b><p>${c.published?'Publicado':'Rascunho'}</p></div>${button('Editar','edit',c.id)}</div>`).join('')}
else if(!state.course)html+=empty('Crie um curso primeiro','Depois cadastre seus módulos, aulas e questões.');
else if(section==='modules'){const m=state.modules.find(m=>m.id===e);html+=`<form id="moduleForm" class="form"><h2>${m?'Editar módulo':'Adicionar módulo'}</h2>${field('Título','title',m?.title||'','text','required maxlength="160"')}${field('Posição no curso','position',m?.position||Math.max(0,...state.modules.map(m=>m.position))+1,'number','required min="1"')}<div class="actions"><button class="btn">Salvar módulo</button>${m?button('Cancelar edição','cancel'):''}</div></form>`+state.modules.map(m=>`<div class="item"><b>${m.position}. ${esc(m.title)}</b><div class="actions">${button('Editar','edit',m.id)}${button('Excluir módulo','deleteModule',m.id,'danger')}</div></div>`).join('')}
else if(section==='lessons'){const l=state.lessons.find(l=>l.id===e);html+=state.modules.length?`<form id="lessonForm" class="form"><h2>${l?'Editar aula':'Adicionar aula'}</h2>${selectModule(l?.module_id)}${field('Título da aula','title',l?.title||'','text','required maxlength="160"')}${field('Posição dentro do módulo','position',l?.position||1,'number','required min="1"')}${field('Link do YouTube (opcional)','youtube',l?.youtube_id?'https://www.youtube.com/watch?v='+l.youtube_id:'','url','placeholder="https://www.youtube.com/watch?v=..."')}<small>Use vídeo público ou não listado, com incorporação permitida. São aceitos links watch, youtu.be, Shorts e live.</small>${area('Descrição / orientações','description',l?.description||'')}<label for="pdfFile">Apostila PDF (até 20 MB)</label><input type="file" id="pdfFile" name="pdf" accept="application/pdf,.pdf">${l?.pdf_path?'<small>Há um PDF vinculado. Um novo envio substituirá o material.</small><label class="checklabel"><input type="checkbox" name="removePdf"> Remover apostila atual</label>':''}<div class="actions"><button class="btn">Salvar aula</button>${l?button('Cancelar edição','cancel'):''}</div></form>`:empty('Cadastre um módulo','As aulas pertencem a um módulo.');html+=state.lessons.map(l=>`<div class="item"><b>${esc(state.modules.find(m=>m.id===l.module_id)?.title)} · ${l.position}. ${esc(l.title)}</b><p>${l.youtube_id?'Vídeo cadastrado':'Sem vídeo'} · ${l.pdf_path?'Com apostila':'Sem apostila'}</p><div class="actions">${button('Editar','edit',l.id)}${button('Excluir aula','deleteLesson',l.id,'danger')}</div></div>`).join('')}
else if(section==='questions'){const q=state.questions.find(q=>q.id===e);html+=state.modules.length?`<form class="form" id="questionForm"><h2>${q?'Editar questão':'Adicionar questão'}</h2>${selectModule(q?.module_id)}${field('Posição','position',q?.position||1,'number','required min="1"')}${area('Enunciado','prompt',q?.prompt||'','required')}${area('Alternativas: uma por linha (2 a 5)','options',q?.options.join('\n')||'','required')}${field('Número da alternativa correta (1 a 5)','correct',q?q.correct_index+1:1,'number','required min="1" max="5"')}${area('Comentário do gabarito','explanation',q?.explanation||'')}<div class="actions"><button class="btn">Salvar questão</button>${q?button('Cancelar edição','cancel'):''}</div></form>`:empty('Cadastre um módulo','As avaliações são organizadas por módulo.');html+=state.questions.map(q=>`<div class="item"><span class="eyebrow">${esc(state.modules.find(m=>m.id===q.module_id)?.title)}</span><h3>${esc(q.prompt)}</h3><p>Resposta: ${q.correct_index+1}. ${esc(q.options[q.correct_index])}</p><div class="actions">${button('Editar','edit',q.id)}${button('Excluir questão','deleteQuestion',q.id,'danger')}</div></div>`).join('')}
return html}
async function quiz(moduleId){const box=$('#quiz-'+moduleId);if(!box)return;const questions=await query(db.rpc('get_quiz',{p_module:moduleId}));if(!questions.length){box.innerHTML=empty('Avaliação em preparação','Este módulo ainda não tem questões.');return}box.innerHTML=`<form class="form" id="quizForm" data-module="${moduleId}"><h2>Avaliação do módulo</h2><p>Responda todas as questões. Você pode fazer novas tentativas.</p>${questions.map((q,i)=>`<fieldset><legend>Questão ${i+1}</legend><p class="pre">${esc(q.prompt)}</p>${q.options.map((o,j)=>`<label class="checklabel"><input type="radio" name="${q.id}" value="${j}" required> ${esc(o)}</label>`).join('')}</fieldset>`).join('')}<button class="btn">Enviar e corrigir</button></form><div id="quizResult" aria-live="polite"></div>`;box.scrollIntoView({behavior:'smooth',block:'start'})}
async function openPdf(id){const l=await query(db.from('lessons').select('pdf_path').eq('id',id).single());if(!l.pdf_path)throw Error('Apostila não disponível.');const r=await query(db.storage.from('course-materials').createSignedUrl(l.pdf_path,300));const a=document.createElement('a');a.href=r.signedUrl;a.target='_blank';a.rel='noopener';a.click();notify('Apostila aberta. Se nada aparecer, permita novas abas no navegador e tente novamente.')}
async function cleanup(paths){if(!paths.length)return;const {error}=await db.storage.from('course-materials').remove(paths);if(error)notify('Conteúdo salvo, mas houve falha ao remover um PDF antigo. Remova o arquivo sem uso no Storage.',true)}
async function handleAction(action,id){if(['catalog','auth','about'].includes(action))return go(action);if(action==='course'||action==='lesson')return go(action,id);if(action==='authMode'){state.authMode=id;return go('auth')}if(action==='section'){state.section=id;state.editing=null;return render()}if(action==='edit'){state.editing=id;await render();window.scrollTo(0,0);return}if(action==='cancel'){state.editing=null;return render()}if(action==='enroll'){await query(db.from('enrollments').insert({user_id:state.user.id,course_id:id}));notify('Inscrição concluída!');return refreshSession()}if(action==='complete'){const done=state.progress.some(p=>p.lesson_id===id);if(done)await query(db.from('progress').delete().eq('user_id',state.user.id).eq('lesson_id',id));else await query(db.from('progress').insert({user_id:state.user.id,lesson_id:id}));return refreshSession()}if(action==='quiz')return quiz(id);if(action==='pdf')return openPdf(id);if(!state.admin)throw Error('Sem permissão.');if(action==='deleteQuestion'){if(!confirm('Excluir esta questão definitivamente? As notas anteriores serão preservadas.'))return;await query(db.from('questions').delete().eq('id',id))}else if(action==='deleteLesson'){if(!confirm('Excluir esta aula e seu progresso definitivamente?'))return;const l=state.lessons.find(l=>l.id===id);await query(db.from('lessons').delete().eq('id',id));await cleanup(l?.pdf_path?[l.pdf_path]:[])}else if(action==='deleteModule'){if(!confirm('Excluir este módulo, suas aulas, questões, progresso e resultados definitivamente?'))return;const paths=state.lessons.filter(l=>l.module_id===id&&l.pdf_path).map(l=>l.pdf_path);await query(db.from('modules').delete().eq('id',id));await cleanup(paths)}state.editing=null;notify('Alteração concluída.');await refreshSession()}
async function submit(form){const f=new FormData(form),v=k=>String(f.get(k)||'').trim();if(form.id==='authForm'){const redirect=location.origin+location.pathname;if(state.authMode==='login'){await query(db.auth.signInWithPassword({email:v('email'),password:String(f.get('password'))}));state.route='home';notify('Acesso realizado.');return refreshSession()}if(state.authMode==='signup'){const r=await query(db.auth.signUp({email:v('email'),password:String(f.get('password')),options:{emailRedirectTo:redirect}}));if(r.session){state.route='home';await refreshSession();notify('Conta criada.')}else{const msg='Solicitação recebida. Verifique seu e-mail para confirmar a conta. Se já tem cadastro, entre ou recupere sua senha.';$('#authMessage').textContent=msg;notify(msg)}return}await query(db.auth.resetPasswordForEmail(v('email'),{redirectTo:redirect}));$('#authMessage').textContent='Se houver uma conta com este e-mail, você receberá o link de recuperação.';return}
if(form.id==='passwordForm'){await query(db.auth.updateUser({password:String(f.get('password'))}));state.recovery=false;state.route='home';history.replaceState(null,'',location.pathname);notify('Senha atualizada.');return refreshSession()}
if(form.id==='quizForm'){const answers=Object.fromEntries([...f.entries()].map(([k,v])=>[k,Number(v)]));const result=await query(db.rpc('submit_quiz',{p_module:form.dataset.module,p_answers:answers}));$('#quizResult').innerHTML=`<div class="notice"><h2>Resultado: ${result.score}/${result.total} · ${Math.round(result.score/result.total*100)}%</h2><p>Nota registrada no seu histórico.</p></div>`+result.details.map((d,i)=>`<div class="item"><b>${i+1}. ${d.selected===d.correct?'✓ Correta':'Resposta incorreta'}</b><p>${esc(d.prompt)}</p><p>Gabarito: ${d.correct+1}. ${esc(d.correct_text)}</p><p>${esc(d.explanation)}</p></div>`).join('');$('#quizResult').scrollIntoView({behavior:'smooth'});return}
if(!state.admin)throw Error('Área exclusiva do administrador.');const edit=state.editing;
if(form.id==='courseForm'){const payload={title:v('title'),description:v('description'),category:v('category'),published:f.has('published')};if(edit)await query(db.from('courses').update(payload).eq('id',edit));else{const c=await query(db.from('courses').insert(payload).select().single());state.course=c.id}}
if(form.id==='moduleForm'){const payload={course_id:state.course,title:v('title'),position:Number(v('position'))};if(edit)await query(db.from('modules').update(payload).eq('id',edit));else await query(db.from('modules').insert(payload))}
if(form.id==='questionForm'){const options=v('options').split('\n').map(s=>s.trim()).filter(Boolean),correct=Number(v('correct'))-1;if(options.length<2||options.length>5||correct<0||correct>=options.length)throw Error('Cadastre de 2 a 5 alternativas e selecione um gabarito válido.');const payload={module_id:v('module_id'),prompt:v('prompt'),options,correct_index:correct,explanation:v('explanation'),position:Number(v('position'))};if(edit)await query(db.from('questions').update(payload).eq('id',edit));else await query(db.from('questions').insert(payload))}
if(form.id==='lessonForm'){const previous=state.lessons.find(l=>l.id===edit);const payload={module_id:v('module_id'),title:v('title'),position:Number(v('position')),description:v('description'),youtube_id:youtubeId(v('youtube')),pdf_path:f.has('removePdf')?null:previous?.pdf_path||null};const file=f.get('pdf');let uploaded=null;if(file?.size){if(file.size>20*1024*1024)throw Error('O PDF deve ter no máximo 20 MB.');const signature=new TextDecoder().decode(await file.slice(0,5).arrayBuffer());if(signature!=='%PDF-')throw Error('Selecione um arquivo PDF válido.');uploaded=state.course+'/'+uid()+'.pdf';await query(db.storage.from('course-materials').upload(uploaded,file,{contentType:'application/pdf',upsert:false}));payload.pdf_path=uploaded}try{if(edit)await query(db.from('lessons').update(payload).eq('id',edit));else await query(db.from('lessons').insert(payload))}catch(e){if(uploaded)await cleanup([uploaded]);throw e}if(previous?.pdf_path&&previous.pdf_path!==payload.pdf_path)await cleanup([previous.pdf_path])}
state.editing=null;notify('Conteúdo salvo com sucesso.');await refreshSession()}
$('#nav').onclick=e=>{const b=e.target.closest('[data-route]');if(b)go(b.dataset.route)};
$('#account').onclick=async()=>{try{if(!db)return;if(state.user){await query(db.auth.signOut());state.route='home';await refreshSession()}else go('auth')}catch(e){notify(explain(e),true)}};
$('#app').addEventListener('click',async e=>{const b=e.target.closest('[data-action]');if(!b||b.disabled)return;b.disabled=true;try{await handleAction(b.dataset.action,b.dataset.id)}catch(e){notify(explain(e),true)}finally{b.disabled=false}});
$('#app').addEventListener('change',e=>{if(e.target.id==='adminCourse'){state.course=e.target.value;state.editing=null;render().catch(e=>notify(explain(e),true))}});
$('#app').addEventListener('submit',async e=>{e.preventDefault();const b=e.target.querySelector('button[type=submit],button:not([type])');if(b?.disabled)return;if(b)b.disabled=true;try{await submit(e.target)}catch(err){notify(explain(err),true)}finally{if(b)b.disabled=false}});
async function boot(){if(!/^https:\/\//.test(SUPABASE_URL)||SUPABASE_PUBLIC_KEY.startsWith('COLE_')){$('#app').innerHTML=head('Instalação','A Odonto Einstein está pronta para conectar.','Configure SUPABASE_URL e SUPABASE_PUBLIC_KEY no início do script deste index.html e execute supabase.sql no seu projeto.')+'<div class="notice">Consulte o arquivo LEIA-ME.md incluído no pacote. Não use a chave service_role ou secret key.</div>'+footer();return}try{const {createClient}=await import(SDK_URL);db=createClient(SUPABASE_URL,SUPABASE_PUBLIC_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});state.recovery=new URLSearchParams(location.hash.slice(1)).get('type')==='recovery';db.auth.onAuthStateChange((event)=>{if(event==='PASSWORD_RECOVERY')state.recovery=true;setTimeout(()=>refreshSession().catch(e=>notify(explain(e),true)),0)});await refreshSession();if(location.hash&&!state.recovery)history.replaceState(null,'',location.pathname+location.search)}catch(e){$('#app').innerHTML=head('Conexão','Não foi possível carregar a plataforma.',explain(e))+'<div class="notice">Confira a URL, a chave pública, o acesso à internet e a execução do SQL. Recarregue a página depois de corrigir.</div>'}}
boot();
</script></body></html>
